<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Open Book Base -->
  <path d="M30 150 C 30 150, 70 160, 100 150 C 130 160, 170 150, 170 150 V 110 C 170 110, 130 120, 100 110 C 70 120, 30 110, 30 110 V 150 Z" fill="#334155" stroke="#1e293b" stroke-width="4" stroke-linejoin="round"/>
  <!-- Spine -->
  <path d="M100 150 V 110" stroke="#1e293b" stroke-width="4"/>
  
  <!-- Pages Thickness -->
  <path d="M30 150 V 160 C 30 160, 70 170, 100 160 C 130 170, 170 160, 170 160 V 150" fill="#1e293b" stroke="#1e293b" stroke-width="4" opacity="0.4"/>

  <!-- Graph Bars rising from book -->
  <rect x="45" y="85" width="20" height="40" rx="2" fill="#64748b" opacity="0.8"/>
  <rect x="75" y="65" width="20" height="60" rx="2" fill="#475569" opacity="0.9"/>
  <rect x="105" y="45" width="20" height="80" rx="2" fill="#334155"/>
  <rect x="135" y="25" width="20" height="100" rx="2" fill="#1e293b"/>

  <!-- Upward Arrow -->
  <path d="M40 95 L 145 25" stroke="#4f46e5" stroke-width="8" stroke-linecap="round"/>
  <path d="M110 25 H 145 V 60" stroke="#4f46e5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>