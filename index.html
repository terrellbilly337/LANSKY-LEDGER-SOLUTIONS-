<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lansky Ledger Solutions</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              // We override slate to use CSS variables injected by App.tsx
              // This allows the "Secondary Accent" to control the background tint
              slate: {
                50: 'var(--bg-50)',
                100: 'var(--bg-100)',
                200: 'var(--bg-200)',
                300: 'var(--bg-300)',
                400: 'var(--bg-400)',
                500: 'var(--bg-500)',
                600: 'var(--bg-600)',
                700: 'var(--bg-700)',
                800: 'var(--bg-800)',
                850: 'var(--bg-850)', // Custom for sidebar/cards
                900: 'var(--bg-900)',
                950: 'var(--bg-950)',
              }
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --primary: #4f46e5; /* Default Indigo */
        
        /* Default Backgrounds (Slate Fallback) - will be overridden by JS */
        --bg-50: #f8fafc;
        --bg-100: #f1f5f9;
        --bg-200: #e2e8f0;
        --bg-300: #cbd5e1;
        --bg-400: #94a3b8;
        --bg-500: #64748b;
        --bg-600: #475569;
        --bg-700: #334155;
        --bg-800: #1e293b;
        --bg-850: #1a2333;
        --bg-900: #0f172a;
        --bg-950: #020617;
      }
      /* Custom Scrollbar for the Stealth Look */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: var(--bg-400); 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--bg-500); 
      }
      .dark ::-webkit-scrollbar-track {
        background: var(--bg-900);
      }
      .dark ::-webkit-scrollbar-thumb {
        background: var(--bg-700);
      }
      .dark ::-webkit-scrollbar-thumb:hover {
        background: var(--bg-600);
      }
      
      body {
        /* Default to light mode colors if JS fails, but classes handle it */
        background-color: var(--bg-50); 
        color: var(--bg-800); 
      }
      .dark body {
        background-color: var(--bg-900);
        color: var(--bg-200); 
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "recharts": "https://esm.sh/recharts@^3.7.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "jspdf": "https://esm.sh/jspdf@^4.1.0",
    "jspdf-autotable": "https://esm.sh/jspdf-autotable@^5.0.7"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
