    <style>
      :root {

      /* Custom Scrollbar for the Stealth Look */
      ::-webkit-scrollbar {
        width: 8px;

      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: #94a3b8;

      }

      }

        background: #4b5563;
      }
      
      body {
        /* Default to light mode colors if JS fails, but classes handle it */
        background-color: #f8fafc; /* Slate 50 */
        color: #1e293b; /* Slate 800 */
      }
      .dark body {
        background-color: #0f172a; /* Slate 900 */
